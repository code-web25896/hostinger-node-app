<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beauty Academy Tunis - Centre de Formation</title>
    <meta name="description" content="Centre premium de formation esthetique a Tunis Belvedere: microneedling, capillaire, hydrafacial, soins visage et plus." />
    <meta name="keywords" content="#microneedling,#capillaire,#esthetiqueavancee,#formationprofessionnelle,#formationenligne,#formationpresentiel,#hydrafacial,#tunis" />
    <script type="module" crossorigin src="/assets/index-B9G38RkP.js?v=20260331-05"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-qGXqTXna.css?v=20260331-05">
    <link rel="stylesheet" href="/hero-overrides.css?v=20260331-05">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const move = () => {
          const headings = Array.from(document.querySelectorAll("h2"));
          const partnersHeading = headings.find(
            (h) => h.textContent.trim() === "Nos Partenaires"
          );
          const contactHeading = headings.find(
            (h) => h.textContent.trim() === "Nous Trouver"
          );
          if (!partnersHeading || !contactHeading) return false;
          const partnersSection = partnersHeading.closest("section");
          const contactSection = contactHeading.closest("section");
          if (!partnersSection || !contactSection) return false;
          if (partnersSection === contactSection) return false;
          if (partnersSection.nextElementSibling === contactSection) return true;
          contactSection.parentNode.insertBefore(partnersSection, contactSection);
          return true;
        };

        const tryMove = () => {
          if (move()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryMove);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryMove, 400);
        window.addEventListener("load", tryMove);
      })();
    </script>
    <script>
      (function () {
        const upgrade = () => {
          let changed = false;
          const chips = Array.from(document.querySelectorAll("div,span,p,li"));
          chips.forEach((el) => {
            if (el.textContent && el.textContent.trim() === "Amincissement et remoulage") {
              el.textContent = "Amincissement et remodelage";
              changed = true;
            }
          });

          const cvLink = document.querySelector('a[href="/formatrice-gharbi.pdf"]');
          if (cvLink) {
            cvLink.setAttribute("target", "_blank");
            cvLink.setAttribute("rel", "noopener");
            cvLink.className =
              "mt-5 inline-flex w-full items-center justify-center gap-3 rounded-full border border-[#d7c3a1] bg-[linear-gradient(120deg,#fffaf1,#f7ead6)] px-5 py-3 text-sm font-semibold text-[#1f2a44] shadow-[0_16px_32px_rgba(18,26,46,0.12)] transition hover:-translate-y-0.5 hover:border-[#caa56a] hover:bg-[linear-gradient(120deg,#fff7e8,#f1e1c6)]";
            if (!cvLink.querySelector(".cv-pill")) {
              cvLink.innerHTML = '<span class="cv-pill flex h-8 w-8 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gold shadow-[0_8px_16px_rgba(15,23,42,0.12)]">PDF</span>Voir le CV';
            }
            changed = true;
          }

          return changed;
        };

        const tryUpgrade = () => {
          if (upgrade()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryUpgrade);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryUpgrade, 400);
        window.addEventListener("load", tryUpgrade);
      })();
    </script>
    <script>
      (function () {
        const buildCard = (name, img, pdf, role, altImg) => `
          <article class="rounded-[28px] border border-white/70 bg-white/90 p-4 shadow-[0_16px_40px_rgba(15,23,42,0.12)] md:p-5">
            <div class="overflow-hidden rounded-[22px] border border-[#efe5d8] bg-white">
              <img src="${img}" alt="${name}" data-alt="${altImg || ""}" class="h-[260px] w-full object-contain p-3 md:h-[320px]" onerror="if(this.dataset.alt){this.onerror=null;this.src=this.dataset.alt;this.dataset.alt='';return;}this.onerror=null;this.src='/logo.jpeg';" />
            </div>
            <h3 class="mt-4 text-2xl font-semibold text-[#0a0f1a]">${name}</h3>
            <p class="mt-1 text-sm font-semibold uppercase tracking-[0.22em] text-gold">${role}</p>
            <a href="${pdf}" target="_blank" rel="noopener" class="mt-4 inline-flex w-full items-center justify-center gap-3 rounded-full border border-[#d7c3a1] bg-[linear-gradient(120deg,#fffaf1,#f7ead6)] px-5 py-3 text-sm font-semibold text-[#1f2a44] shadow-[0_16px_32px_rgba(18,26,46,0.12)] transition hover:-translate-y-0.5 hover:border-[#caa56a] hover:bg-[linear-gradient(120deg,#fff7e8,#f1e1c6)]">
              <span class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gold shadow-[0_8px_16px_rgba(15,23,42,0.12)]">PDF</span>
              Voir le CV
            </a>
          </article>
        `;

        const replaceSection = () => {
          const sections = Array.from(document.querySelectorAll("section"));
          const candidate = sections.find(
            (s) =>
              s.textContent.includes("Notre formatrice") ||
              (s.querySelector("h2") &&
                s.querySelector("h2").textContent.trim() === "Madame Gharbi")
          );

          const newMarkup = `
            <div class="mx-auto max-w-7xl px-5 py-8 md:px-8 md:py-12">
              <div class="flex items-center gap-3">
                <p class="text-sm font-bold uppercase tracking-[0.24em] text-gold">Nos formatrices</p>
              </div>
              <h2 class="section-title mt-3 text-4xl font-bold leading-tight text-[#0a0f1a] md:text-5xl">Une equipe pedagogique experimentee</h2>
              <p class="mt-4 max-w-2xl text-base leading-8 text-slate-900">
                Des formatrices exigeantes, bienveillantes et orientees resultats pour un apprentissage premium.
              </p>
              <div class="mt-8 grid gap-6 md:grid-cols-2">
                ${buildCard("Madame Gharbi", "/formatrice-gharbi.jpeg", "/formatrice-gharbi.pdf", "Esthetique avancee", "/formatrice-gharbi.jpg")}
                ${buildCard("Madame Oumayma", "/formatrice-oumayma.jpg", "/cv-oumayma.pdf", "Kinesitherapeute", "/formatriceoumayma.jpeg")}
              </div>
            </div>
          `;

          if (candidate) {
            candidate.innerHTML = newMarkup;
            const duplicates = Array.from(document.querySelectorAll("section"))
              .filter((s) =>
                s !== candidate &&
                (s.textContent.includes("Nos formatrices") ||
                  s.textContent.includes("Une equipe pedagogique experimentee"))
              );
            duplicates.forEach((s) => s.remove());
            return true;
          }

          const offersHeading = Array.from(document.querySelectorAll("h2")).find(
            (h) => h.textContent.trim() === "Nos Offres"
          );
          if (!offersHeading) return false;
          const offersSection = offersHeading.closest("section");
          if (!offersSection) return false;
          if (document.getElementById("nos-formatrices")) return true;

          const section = document.createElement("section");
          section.id = "nos-formatrices";
          section.className =
            "mt-12 overflow-hidden rounded-[30px] border border-[#ead9c0] bg-[linear-gradient(135deg,#fffdfa_0%,#f7ecde_52%,#fff9f4_100%)] shadow-[0_20px_60px_rgba(36,28,21,0.08)] md:mt-16 md:rounded-[36px]";
          section.innerHTML = newMarkup;
          offersSection.parentNode.insertBefore(section, offersSection);
          const duplicates = Array.from(document.querySelectorAll("section"))
            .filter((s) =>
              s !== section &&
              (s.textContent.includes("Nos formatrices") ||
                s.textContent.includes("Une equipe pedagogique experimentee"))
            );
          duplicates.forEach((s) => s.remove());
          return true;
        };

        const tryReplace = () => {
          if (replaceSection()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryReplace);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryReplace, 400);
        window.addEventListener("load", tryReplace);
      })();
    </script>
    <script>
      (function () {
        const BANK_INFO = {
          name: "ACADEMIE INTERNATIONALE BEAUTE",
          bank: "Attijari Bank",
          rib: "04 012 08600 94325762 87",
          iban: "TN59 0070 0800 3423 6271 7571",
          bic: "BSTUTNTT"
        };

        const findAmount = (root) => {
          const texts = Array.from(root.querySelectorAll("*"))
            .map((el) => el.textContent || "")
            .filter(Boolean);
          const match = texts
            .map((t) => t.match(/\\b\\d[\\d\\s.]*\\s?(TND|DT|EUR)\\b/i))
            .find((m) => m);
          return match ? match[0].replace(/\\s+/g, " ").trim() : "";
        };

        const renderBox = (amount) => {
          const amountLine = amount
            ? `Montant a regler : <strong>${amount}</strong>`
            : "Montant a regler : <strong>le prix de la formation selectionnee</strong>";

          return `
            <section class="mt-6 rounded-[26px] border border-[#ead9c0] bg-[linear-gradient(135deg,#fffdfa_0%,#f7ecde_55%,#fff9f4_100%)] p-5 shadow-[0_18px_50px_rgba(36,28,21,0.08)]">
              <div class="flex items-center gap-3">
                <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#fbf2e2] text-gold">EUR</span>
                <div>
                  <p class="text-xs font-bold uppercase tracking-[0.28em] text-gold">Paiement par virement</p>
                  <h3 class="text-2xl font-semibold text-[#0a0f1a]">Reglez votre inscription apres confirmation</h3>
                </div>
              </div>
              <p class="mt-3 text-sm text-slate-700">
                ${amountLine}. Utilisez l'intitule et votre numero de telephone comme reference.
              </p>
              <div class="mt-4 grid gap-3 md:grid-cols-2">
                <div class="rounded-[18px] bg-white/90 px-4 py-3 text-sm text-slate-700">
                  <p class="font-semibold text-[#0a0f1a]">Beneficiaire</p>
                  <p>${BANK_INFO.name}</p>
                </div>
                <div class="rounded-[18px] bg-white/90 px-4 py-3 text-sm text-slate-700">
                  <p class="font-semibold text-[#0a0f1a]">Banque</p>
                  <p>${BANK_INFO.bank}</p>
                </div>
                <div class="rounded-[18px] bg-white/90 px-4 py-3 text-sm text-slate-700">
                  <p class="font-semibold text-[#0a0f1a]">RIB</p>
                  <p>${BANK_INFO.rib}</p>
                </div>
                <div class="rounded-[18px] bg-white/90 px-4 py-3 text-sm text-slate-700">
                  <p class="font-semibold text-[#0a0f1a]">IBAN / BIC</p>
                  <p>${BANK_INFO.iban}</p>
                  <p class="text-xs text-slate-500">BIC : ${BANK_INFO.bic}</p>
                </div>
              </div>
              <p class="mt-3 text-xs text-slate-500">
                Une fois le virement effectue, notre equipe valide votre inscription.
              </p>
            </section>
          `;
        };

        const insertAfterSuccess = () => {
          const successNodes = Array.from(document.querySelectorAll("*"))
            .filter((el) =>
              /demande envoyee|inscription confirmee|merci/i.test(
                (el.textContent || "").replace(/\\s+/g, " ")
              )
            );
          if (!successNodes.length) return false;
          const target = successNodes[0];
          const container = target.closest("section") || target.parentElement;
          if (!container || container.querySelector("#bank-transfer-box")) return false;
          const amount = findAmount(container) || findAmount(document.body);
          const wrapper = document.createElement("div");
          wrapper.id = "bank-transfer-box";
          wrapper.innerHTML = renderBox(amount);
          container.appendChild(wrapper);
          return true;
        };

        const enhancePaymentChooser = () => {
          const successCard = Array.from(document.querySelectorAll("div,section"))
            .find((el) =>
              /Inscription reussie/i.test(el.textContent || "")
            );
          if (!successCard) return false;

          const card = successCard;
          const existing = document.querySelector("#payment-details-panel");
          if (existing && !card.contains(existing)) {
            existing.remove();
          }
          if (card.querySelector("#payment-details-panel")) return true;

          card.style.overflow = "visible";
          card.style.background = "linear-gradient(135deg,#eef8ef 0%,#f6fff6 60%,#ffffff 100%)";
          card.style.border = "1px solid #dfeee0";
          card.style.boxShadow = "0 18px 40px rgba(20,30,50,0.08)";
          card.style.padding = "18px";
          card.style.borderRadius = "22px";
          const panel = document.createElement("div");
          panel.id = "payment-details-panel";
          panel.className =
            "mt-4 rounded-[20px] border border-[#ead9c0] bg-white/95 p-4 text-sm text-slate-700 shadow-[0_14px_28px_rgba(15,23,42,0.08)]";
          panel.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-xs font-bold uppercase tracking-[0.24em] text-gold">Instructions</p>
                <h4 class="mt-1 text-lg font-semibold text-[#0a0f1a]">Choisissez votre moyen de paiement</h4>
              </div>
              <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#fbf2e2] text-gold">EUR</span>
            </div>
            <div class="mt-3 space-y-3">
              <div id="method-virement" class="rounded-[18px] border border-[#e9e0d2] bg-[#fffaf1] px-4 py-3">
                <p class="font-semibold text-[#0a0f1a]">Virement bancaire</p>
                <div class="mt-2 grid gap-2 text-[13px]">
                  <p><span class="font-semibold text-[#0a0f1a]">Beneficiaire :</span> ${BANK_INFO.name}</p>
                  <p><span class="font-semibold text-[#0a0f1a]">Banque :</span> ${BANK_INFO.bank}</p>
                  <p><span class="font-semibold text-[#0a0f1a]">RIB :</span> ${BANK_INFO.rib}</p>
                  <p><span class="font-semibold text-[#0a0f1a]">IBAN :</span> ${BANK_INFO.iban}</p>
                  <p class="text-xs text-slate-500">BIC/SWIFT : ${BANK_INFO.bic}</p>
                </div>
              </div>
              <div id="method-visa" class="hidden rounded-[18px] border border-[#e9e0d2] bg-[#f7f4ff] px-4 py-3">
                <p class="font-semibold text-[#0a0f1a]">Visa</p>
                <p class="mt-1">Paiement par carte apres inscription. Notre equipe vous transmettra les etapes.</p>
              </div>
              <div id="method-binance" class="hidden rounded-[18px] border border-[#e9e0d2] bg-[#fff4ea] px-4 py-3">
                <p class="font-semibold text-[#0a0f1a]">Binance</p>
                <p class="mt-1">Paiement crypto apres inscription. Nous envoyons les details par message.</p>
              </div>
              <div id="method-redotpay" class="hidden rounded-[18px] border border-[#e9e0d2] bg-[#eef6ff] px-4 py-3">
                <p class="font-semibold text-[#0a0f1a]">Redotpay</p>
                <p class="mt-1">Paiement en ligne apres inscription. Contactez-nous pour les informations.</p>
              </div>
            </div>
          `;

          card.appendChild(panel);

          const show = (id) => {
            ["method-virement", "method-visa", "method-binance", "method-redotpay"].forEach((key) => {
              const el = panel.querySelector(`#${key}`);
              if (!el) return;
              el.classList.toggle("hidden", key !== id);
            });
          };

          const buttons = Array.from(card.querySelectorAll("button, a"));
          buttons.forEach((btn) => {
            const label = (btn.textContent || "").toLowerCase();
            btn.style.border = "1px solid #e8d7bc";
            btn.style.background = "#fff";
            btn.style.borderRadius = "999px";
            btn.style.padding = "10px 14px";
            btn.style.fontWeight = "600";
            btn.style.boxShadow = "0 10px 24px rgba(15,23,42,0.08)";
            if (label.includes("virement")) btn.addEventListener("click", () => show("method-virement"));
            if (label.includes("visa")) btn.addEventListener("click", () => show("method-visa"));
            if (label.includes("binance")) btn.addEventListener("click", () => show("method-binance"));
            if (label.includes("redotpay")) btn.addEventListener("click", () => show("method-redotpay"));
          });

          show("method-virement");
          return true;
        };

        const hookButtons = () => {
          document.querySelectorAll("button").forEach((btn) => {
            if (/s'inscrire/i.test(btn.textContent || "")) {
              btn.addEventListener("click", () => {
                setTimeout(insertAfterSuccess, 600);
              });
            }
          });
        };

        const tryInsert = () => {
          hookButtons();
          insertAfterSuccess();
          enhancePaymentChooser();
        };

        const observer = new MutationObserver(tryInsert);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener("load", tryInsert);
        setInterval(tryInsert, 1200);
      })();
    </script>
  </body>
</html>
