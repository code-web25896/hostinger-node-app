          const closeBtn = widget.querySelector("#chatbot-close");
          const messagesDiv = widget.querySelector("#chatbot-messages");
          const inputEl = widget.querySelector("#chatbot-input");
          const sendBtn = widget.querySelector("#chatbot-send-btn");
          const quickBtns = widget.querySelectorAll(".chatbot-quick-btn");

          const addMsg = (text, isUser) => {
            const div = document.createElement("div");
            div.className = "chatbot-msg " + (isUser ? "user" : "bot");
            div.innerHTML = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          };

          const sendMsg = (text) => {
            const q = (text || inputEl.value).trim();
            if (!q) return;
            addMsg(q, true);
            inputEl.value = "";
            setTimeout(() => {
              addMsg(findAnswer(q), false);
            }, 420);
          };

          toggleBtn.addEventListener("click", () => {
            panel.classList.toggle("open");
            if (panel.classList.contains("open")) inputEl.focus();
          });
          closeBtn.addEventListener("click", () => panel.classList.remove("open"));
          sendBtn.addEventListener("click", () => sendMsg());
          inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
          quickBtns.forEach(btn => btn.addEventListener("click", () => {
            panel.classList.add("open");
            sendMsg(btn.dataset.q);
          }));
        };

        // Mount chatbot after DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", createChatbot);
        } else {
          createChatbot();
        }
      })();
    </script></body>
</html>
