    <script>
      (function () {
        const move = () => {
          const headings = Array.from(document.querySelectorAll("h2"));
          const partnersHeading = headings.find(
            (h) => h.textContent.trim() === "Nos Partenaires"
          );
          const contactHeading = headings.find(
            (h) => h.textContent.trim() === "Nous Trouver"
          );
          if (!partnersHeading || !contactHeading) return false;
          const partnersSection = partnersHeading.closest("section");
          const contactSection = contactHeading.closest("section");
          if (!partnersSection || !contactSection) return false;
          if (partnersSection === contactSection) return false;
          if (partnersSection.nextElementSibling === contactSection) return true;
          contactSection.parentNode.insertBefore(partnersSection, contactSection);
          return true;
        };

        const tryMove = () => {
          if (move()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryMove);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryMove, 400);
        window.addEventListener("load", tryMove);
      })();
    </script>
    <script>
      (function () {
        const rewriteVisibleText = () => {
          let changed = false;
          const nodes = Array.from(document.querySelectorAll("p,span,div,button,a,strong,h1,h2,h3,h4"));
          nodes.forEach((node) => {
            const text = (node.textContent || "").trim();
            if (!text) return;

            if (text === "+216 +21695466836" || text === "+216 95 466 836" || text === "+21695466836") {
              node.textContent = "+33 6 63 11 14 15";
              changed = true;
            }

            if (
              text === "Tunis Belvedere, Tunisie" ||
              text === "Tunis Belvedere" ||
              text === "Belvedere, Tunis Tunisie" ||
              text === "France"
            ) {
              node.textContent = "FRANCE - 75002 PARIS";
              changed = true;
            }
          });

          const addressLabels = Array.from(document.querySelectorAll("p,span,strong,h3,h4")).filter((node) => {
            const text = (node.textContent || "").trim().toLowerCase();
            return text === "adresse";

              const text = (node.textContent || "").trim();

            });
            targets.forEach((node) => {
              node.textContent = "FRANCE - 75002 PARIS";
              changed = true;

          document.querySelectorAll('a[href^="tel:"], button[aria-label*="telephone"], button[aria-label*="Contact telephone"]').forEach((node) => {
            if (node.tagName === "A") {

            if (node.tagName === "BUTTON") {
              node.onclick = () => {
                window.location.href = "tel:+33663111415";
              };
            }
            changed = true;
          });

          const countryButtons = Array.from(document.querySelectorAll("button")).filter((button) =>
            (button.textContent || "").includes("Pays:")
          );
          countryButtons.forEach((button) => {
            if ((button.textContent || "").trim() === "Pays: France") {
              button.textContent = "Pays: Tunisie";

    <script>
      (function () {
        const buildCard = (name, img, pdf, role, altImg) => `
          <article class="rounded-[28px] border border-white/70 bg-white/90 p-4 shadow-[0_16px_40px_rgba(15,23,42,0.12)] md:p-5">
            <div class="overflow-hidden rounded-[22px] border border-[#efe5d8] bg-white">
              <img src="${img}" alt="${name}" data-alt="${altImg || ""}" class="h-[260px] w-full object-contain p-3 md:h-[320px]" onerror="if(this.dataset.alt){this.onerror=null;this.src=this.dataset.alt;this.dataset.alt='';return;}this.onerror=null;this.src='/logo.jpeg';" />
            </div>
            <h3 class="mt-4 text-2xl font-semibold text-[#0a0f1a]">${name}</h3>
            <p class="mt-1 text-sm font-semibold uppercase tracking-[0.22em] text-gold">${role}</p>
            <a href="${pdf}" target="_blank" rel="noopener" class="mt-4 inline-flex w-full items-center justify-center gap-3 rounded-full border border-[#d7c3a1] bg-[linear-gradient(120deg,#fffaf1,#f7ead6)] px-5 py-3 text-sm font-semibold text-[#1f2a44] shadow-[0_16px_32px_rgba(18,26,46,0.12)] transition hover:-translate-y-0.5 hover:border-[#caa56a] hover:bg-[linear-gradient(120deg,#fff7e8,#f1e1c6)]">
              <span class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gold shadow-[0_8px_16px_rgba(15,23,42,0.12)]">PDF</span>
              Voir le CV
            </a>
          </article>
        `;

        const replaceSection = () => {
          const sections = Array.from(document.querySelectorAll("section"));
          const candidate = sections.find(
            (s) =>
              s.textContent.includes("Notre formatrice") ||
              (s.querySelector("h2") &&
                s.querySelector("h2").textContent.trim() === "Madame Gharbi")
          );

          const newMarkup = `
            <div class="mx-auto max-w-7xl px-5 py-8 md:px-8 md:py-12">
              <div class="flex items-center gap-3">
                <p class="text-sm font-bold uppercase tracking-[0.24em] text-gold">Nos formatrices</p>
              </div>
              <h2 class="section-title mt-3 text-4xl font-bold leading-tight text-[#0a0f1a] md:text-5xl">Une equipe pedagogique experimentee</h2>
              <p class="mt-4 max-w-2xl text-base leading-8 text-slate-900">
                Des formatrices exigeantes, bienveillantes et orientees resultats pour un apprentissage premium.
              </p>
              <div class="mt-8 grid gap-6 md:grid-cols-2">
                ${buildCard("Madame Gharbi", "/formatrice-gharbi.jpeg", "/formatrice-gharbi.pdf", "Esthetique avancee", "/formatrice-gharbi.jpg")}
                ${buildCard("Madame Oumayma", "/formatrice-oumayma.jpg", "/cv-oumayma.pdf", "Kinesitherapeute", "/formatriceoumayma.jpeg")}
              </div>
            </div>
          `;

          if (candidate) {
            candidate.innerHTML = newMarkup;
            const duplicates = Array.from(document.querySelectorAll("section"))
              .filter((s) =>
                s !== candidate &&
                (s.textContent.includes("Nos formatrices") ||
                  s.textContent.includes("Une equipe pedagogique experimentee"))
              );
            duplicates.forEach((s) => s.remove());
            return true;
          }

          const offersHeading = Array.from(document.querySelectorAll("h2")).find(
            (h) => h.textContent.trim() === "Nos Offres"
          );
          if (!offersHeading) return false;
          const offersSection = offersHeading.closest("section");
          if (!offersSection) return false;
          if (document.getElementById("nos-formatrices")) return true;

          const section = document.createElement("section");
          section.id = "nos-formatrices";
          section.className =
            "mt-12 overflow-hidden rounded-[30px] border border-[#ead9c0] bg-[linear-gradient(135deg,#fffdfa_0%,#f7ecde_52%,#fff9f4_100%)] shadow-[0_20px_60px_rgba(36,28,21,0.08)] md:mt-16 md:rounded-[36px]";
          section.innerHTML = newMarkup;
          offersSection.parentNode.insertBefore(section, offersSection);
          const duplicates = Array.from(document.querySelectorAll("section"))
            .filter((s) =>
              s !== section &&
              (s.textContent.includes("Nos formatrices") ||
                s.textContent.includes("Une equipe pedagogique experimentee"))
            );
          duplicates.forEach((s) => s.remove());
          return true;
        };

        const tryReplace = () => {
          if (replaceSection()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryReplace);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryReplace, 400);
        window.addEventListener("load", tryReplace);
      })();
    </script>
    <script>
      (function () {
        // Redirection si l'utilisateur arrive sur /demandes
        if (window.location.pathname === "/demandes") {
          window.location.replace("/formations");
        }

        // Nettoyage et conversion 100% WhatsApp
        const cleanAndConvertWhatsApp = () => {
          // 1. Masquer les liens 'Demandes' partout (header, menu mobile, etc.)
          document.querySelectorAll('a[href="/demandes"], a[href*="demandes"]').forEach((el) => {
            const container = el.closest("div, li");
            if (container && container.parentElement && container.parentElement.children.length > 2) {
              container.style.display = "none";
            } else {
              el.style.display = "none";
            }
          });

          // Masquer le bouton 'Demandes' dans la bottom navigation mobile
          document.querySelectorAll('nav a, nav button').forEach((el) => {
            const txt = (el.textContent || "").trim().toLowerCase();
            if (txt === "demandes") {
              el.style.display = "none";
            }
          });

          // 2. Effacer les bandeaux encombrants 'Pays d'inscription'
          document.querySelectorAll("div, p, span").forEach((el) => {
            const txt = (el.textContent || "").trim();
            if (txt.includes("Pays d'inscription:") || txt.includes("Tarifs en EUR") || txt.includes("Tarifs en TND")) {
              if (el.classList.contains("rounded-full") || el.classList.contains("inline-flex")) {
                el.style.display = "none";
              }
            }
          });

          // 3. Remplacer les mentions de devis par inscription WhatsApp
          document.querySelectorAll("p, span, div, li").forEach((el) => {
            const txt = (el.textContent || "").trim();
            if (txt.includes("Vous recevrez alors le devis")) {
              el.textContent = "Nos formations sont réservables directement en ligne auprès de nos conseillères sur WhatsApp.";
            }
            if (txt.includes("Paiement par virement ou Visa")) {
              el.textContent = "Inscription & réservation directe sur WhatsApp";
            }
          });

          // 4. Transformer TOUS les boutons 'S'inscrire' en boutons WhatsApp directs
          const buttons = Array.from(document.querySelectorAll("button, a.btn-secondary, a.btn-primary"));
          buttons.forEach((btn) => {
            const label = (btn.textContent || "").trim().toLowerCase();
            // Cibler les boutons d'inscription aux formations
            if (label === "s'inscrire" || label.includes("s'inscrire") && !label.includes("whatsapp")) {
              if (btn.dataset.waConverted === "true") return;

              // Trouver le titre de la formation dans la carte parente
              const card = btn.closest("article, .dashboard-card, div.rounded-\\[28px\\], div.rounded-\\[24px\\]");
              let trainingTitle = "Formation Esthétique";
              if (card) {
                const titleEl = card.querySelector("h2, h3, h4, p.text-2xl, p.text-xl, p.font-semibold");
                if (titleEl && titleEl.textContent) {
                  trainingTitle = titleEl.textContent.trim();
                }
              }

              const waUrl = "https://wa.me/33663111415?text=" + encodeURIComponent("Bonjour, je souhaite m'inscrire à la formation : " + trainingTitle);

              // Rediriger au clic
              btn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                window.open(waUrl, "_blank", "noopener,noreferrer");
              };

              // Si c'est un lien <a>, modifier le href
              if (btn.tagName === "A") {
                btn.setAttribute("href", waUrl);
                btn.setAttribute("target", "_blank");
                btn.setAttribute("rel", "noopener noreferrer");

              <div class="trust-icon-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
              </div>
              <div class="trust-text">
                <h4>Ateliers 100% Pratique</h4>
                <p>Entraînement encadré sur modèles réels</p>

            <div class="trust-item">
              <div class="trust-icon-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>

          section.appendChild(trustBar);

          // Interaction et animation carrousel
          const track = section.querySelector("#ecom-track");
          const prevBtn = section.querySelector("#ecom-prev-btn");
          const nextBtn = section.querySelector("#ecom-next-btn");

          if (track && prevBtn && nextBtn) {
            const scrollStep = () => track.clientWidth * 0.75;
            prevBtn.addEventListener("click", () => {
              track.scrollBy({ left: -scrollStep(), behavior: "smooth" });
            });
            nextBtn.addEventListener("click", () => {
              track.scrollBy({ left: scrollStep(), behavior: "smooth" });
            });

            // Défilement automatique doux
            let autoPlay = setInterval(() => {
              if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
                track.scrollTo({ left: 0, behavior: "smooth" });
              } else {
                track.scrollBy({ left: 340, behavior: "smooth" });
              }
            }, 3800);

            track.addEventListener("mouseenter", () => clearInterval(autoPlay));
            track.addEventListener("mouseleave", () => {
              autoPlay = setInterval(() => {
                if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
                  track.scrollTo({ left: 0, behavior: "smooth" });
                } else {
                  track.scrollBy({ left: 340, behavior: "smooth" });
                }
              }, 3800);
            });
          }

          return true;
        };

        const tryInjectEcom = () => {
          injectTopBar();
          injectShowcase();
        };

        const observer = new MutationObserver(tryInjectEcom);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener("load", tryInjectEcom);
        setInterval(tryInjectEcom, 600);
      })();
    </script>
