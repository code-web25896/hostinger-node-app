      (function () {
        const move = () => {
          const headings = Array.from(document.querySelectorAll("h2"));
          const partnersHeading = headings.find(
            (h) => h.textContent.trim() === "Nos Partenaires"
          );
          const contactHeading = headings.find(
            (h) => h.textContent.trim() === "Nous Trouver"
          );
          if (!partnersHeading || !contactHeading) return false;
          const partnersSection = partnersHeading.closest("section");
          const contactSection = contactHeading.closest("section");
          if (!partnersSection || !contactSection) return false;
          if (partnersSection === contactSection) return false;
          if (partnersSection.nextElementSibling === contactSection) return true;
          contactSection.parentNode.insertBefore(partnersSection, contactSection);
          return true;
        };

        const tryMove = () => {
          if (move()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryMove);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryMove, 400);
        window.addEventListener("load", tryMove);
      })();
    </script>

              Voir le CV
            </a>
          </article>
        `;

        const replaceSection = () => {
          const sections = Array.from(document.querySelectorAll("section"));
          const candidate = sections.find(
            (s) =>
              s.textContent.includes("Notre formatrice") ||
              (s.querySelector("h2") &&
                s.querySelector("h2").textContent.trim() === "Madame Gharbi")
          );

          const newMarkup = `
            <div class="mx-auto max-w-7xl px-5 py-8 md:px-8 md:py-12">
              <div class="flex items-center gap-3">
                <p class="text-sm font-bold uppercase tracking-[0.24em] text-gold">Nos formatrices</p>
              </div>
              <h2 class="section-title mt-3 text-4xl font-bold leading-tight text-[#0a0f1a] md:text-5xl">Une equipe pedagogique experimentee</h2>
              <p class="mt-4 max-w-2xl text-base leading-8 text-slate-900">
                Des formatrices exigeantes, bienveillantes et orientees resultats pour un apprentissage premium.
              </p>
              <div class="mt-8 grid gap-6 md:grid-cols-2">
                ${buildCard("Madame Gharbi", "/formatrice-gharbi.jpeg", "/formatrice-gharbi.pdf", "Esthetique avancee", "/formatrice-gharbi.jpg")}
                ${buildCard("Madame Oumayma", "/formatrice-oumayma.jpg", "/cv-oumayma.pdf", "Kinesitherapeute", "/formatriceoumayma.jpeg")}
              </div>
            </div>
          `;

          if (candidate) {
            candidate.innerHTML = newMarkup;
            const duplicates = Array.from(document.querySelectorAll("section"))
              .filter((s) =>
                s !== candidate &&
                (s.textContent.includes("Nos formatrices") ||
                  s.textContent.includes("Une equipe pedagogique experimentee"))
              );
            duplicates.forEach((s) => s.remove());
            return true;
          }

          const offersHeading = Array.from(document.querySelectorAll("h2")).find(
            (h) => h.textContent.trim() === "Nos Offres"
          );
          if (!offersHeading) return false;
          const offersSection = offersHeading.closest("section");
          if (!offersSection) return false;
          if (document.getElementById("nos-formatrices")) return true;

          const section = document.createElement("section");
          section.id = "nos-formatrices";
          section.className =
            "mt-12 overflow-hidden rounded-[30px] border border-[#ead9c0] bg-[linear-gradient(135deg,#fffdfa_0%,#f7ecde_52%,#fff9f4_100%)] shadow-[0_20px_60px_rgba(36,28,21,0.08)] md:mt-16 md:rounded-[36px]";
          section.innerHTML = newMarkup;
          offersSection.parentNode.insertBefore(section, offersSection);
          const duplicates = Array.from(document.querySelectorAll("section"))
            .filter((s) =>
              s !== section &&
              (s.textContent.includes("Nos formatrices") ||
                s.textContent.includes("Une equipe pedagogique experimentee"))
            );
          duplicates.forEach((s) => s.remove());
          return true;
        };

        const tryReplace = () => {
          if (replaceSection()) {

            clearInterval(timer);

        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryReplace, 400);
        window.addEventListener("load", tryReplace);

          document.body.appendChild(modal);
          bindReceiptUpload(modal);

          modal.querySelector("#payment-modal-close").addEventListener("click", close);
          modal.querySelector("#payment-modal-backdrop").addEventListener("click", close);
          return true;
        };

        const wrapFetchOnce = () => {
          if (window.__academyFetchWrapped) return;
          window.__academyFetchWrapped = true;
          const originalFetch = window.fetch.bind(window);
          window.fetch = async (input, init = {}) => {
            const url = typeof input === "string" ? input : input.url || "";
            const response = await originalFetch(input, init);
            try {
              if (url.includes("/api/public/enrollments/checkout")) {
                let payload = null;
                if (init.body && typeof init.body === "string") {
                  try {
                    payload = JSON.parse(init.body);
                  } catch (error) {
                    payload = null;
                  }
                }
                if (payload?.email || payload?.phone) {
                  writeJson(STORAGE_KEYS.enrollmentPayload, {
                    email: payload.email?.trim(),
                    phone: payload.phone?.trim(),
                    trainingId: payload.trainingId || null,
                    fullName: payload.fullName || ""
                  });
                }
                const clone = response.clone();
                const data = await clone.json();
                if (data?.enrollmentId) {
                  writeJson(STORAGE_KEYS.enrollment, {
                    id: data.enrollmentId,
                    paymentStatus: data.paymentStatus || "Recu manquant"
                  });
                }
              }
              if (url.includes("/api/public/enrollments/status")) {
                const clone = response.clone();
                const data = await clone.json();
                if (Array.isArray(data)) {
                  writeJson(STORAGE_KEYS.demandes, data);
                }
              }
              if (url.includes("/api/admin/enrollments")) {
                const clone = response.clone();
                const data = await clone.json();
                if (Array.isArray(data)) {
                  window.__academyAdminEnrollments = data;
                }
              }
            } catch (error) {
              // ignore capture errors
            }
            return response;
          };
        };

        const renderReceiptUploader = (context) => `
          <div style="margin-top:14px;border-radius:18px;border:1px dashed #cfe4d2;background:#f5fff6;padding:14px;">
            <div style="font-weight:700;color:#0a0f1a;">Recu de virement obligatoire</div>
            <p style="margin-top:6px;font-size:13px;color:#4a5568;">
              Televersez votre recu (image ou PDF). Sans recu, l'inscription reste en attente.
            </p>
            <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
              <input id="receipt-file" type="file" accept="image/*,.pdf" style="flex:1 1 220px;border-radius:14px;border:1px solid #e2e8f0;background:white;padding:8px 10px;" />
              <button id="receipt-upload" style="flex:0 0 auto;border-radius:999px;border:1px solid #c2d7c4;background:#0f7a3b;color:white;padding:10px 18px;font-weight:700;">Telecharger le recu</button>
            </div>
            <div id="receipt-status" style="margin-top:8px;font-size:12px;color:#1d6a34;"></div>
          </div>
        `;

        const bindReceiptUpload = (root) => {
          const fileInput = root.querySelector("#receipt-file");
          const uploadBtn = root.querySelector("#receipt-upload");
          const status = root.querySelector("#receipt-status");
          if (!fileInput || !uploadBtn || !status) return;

          const ctx = getEnrollmentContext();
          if (ctx.paymentStatus === "Recu" || ctx.paymentStatus === "Paye") {
            status.textContent = "Recu deja televerse. Merci.";
            status.style.color = "#1d6a34";
          }

          uploadBtn.addEventListener("click", async () => {
            if (!fileInput.files || !fileInput.files[0]) {
              status.textContent = "Veuillez choisir un fichier.";
              status.style.color = "#c53030";
              return;
            }

            const ctx = getEnrollmentContext();
            if (!ctx.email || !ctx.phone) {
              status.textContent = "Veuillez indiquer email et telephone dans le formulaire d'inscription.";
              status.style.color = "#c53030";
              return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("email", ctx.email);
            formData.append("phone", ctx.phone);
            if (ctx.trainingId) formData.append("trainingId", ctx.trainingId);

            const endpoint = ctx.id ? `/api/public/enrollments/${ctx.id}/receipt` : "/api/public/enrollments/receipt";
            status.textContent = "Envoi du recu en cours...";
            status.style.color = "#1d6a34";

            try {
              const res = await fetch(endpoint, { method: "POST", body: formData });
              if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.message || "Impossible d'envoyer le recu.");
              }
              const data = await res.json();
              if (data?.enrollment?.id) {
                writeJson(STORAGE_KEYS.enrollment, {
                  id: data.enrollment.id,
                  paymentStatus: data.enrollment.paymentStatus
                });
              }
              status.textContent = "Recu televerse. Notre equipe validera votre paiement.";
              status.style.color = "#1d6a34";
            } catch (error) {
              status.textContent = error.message || "Erreur lors de l'envoi.";
              status.style.color = "#c53030";
            }
          });
        };

        const injectDemandesUploader = () => {
          if (window.location.pathname !== "/demandes") return false;
          if (document.getElementById("demandes-receipt-uploader")) return true;

          const container = document.querySelector("main") || document.querySelector("#root");
          if (!container) return false;

          const section = document.createElement("section");
          section.id = "demandes-receipt-uploader";
          section.className = "dashboard-card";
          section.style.marginTop = "20px";
          section.innerHTML = `
            <div style="display:flex;flex-direction:column;gap:12px;">
              <h3 style="font-size:20px;font-weight:700;color:#091632;">Ajouter votre recu de virement</h3>
              <p style="font-size:14px;color:#4a5568;">Si vous avez quitte le formulaire, televersez votre recu ici. Sans recu, l'inscription reste en attente.</p>
              <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
                <input id="demandes-email" class="soft-input" placeholder="Email" />
                <input id="demandes-phone" class="soft-input" placeholder="Telephone" />
                <select id="demandes-training" class="soft-input">
                  <option value="">Selectionnez la formation (optionnel)</option>
                </select>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
                <input id="demandes-file" type="file" accept="image/*,.pdf" class="soft-input" style="padding:10px 12px;" />
                <button id="demandes-upload" class="btn-primary" type="button">Telecharger le recu</button>
              </div>
              <p id="demandes-status" style="font-size:12px;color:#1d6a34;"></p>
            </div>
          `;
          container.appendChild(section);

          const emailInput = section.querySelector("#demandes-email");
          const phoneInput = section.querySelector("#demandes-phone");
          const trainingSelect = section.querySelector("#demandes-training");
          const fileInput = section.querySelector("#demandes-file");
          const uploadBtn = section.querySelector("#demandes-upload");
          const status = section.querySelector("#demandes-status");

          const ctx = getEnrollmentContext();
          if (ctx.email) emailInput.value = ctx.email;
          if (ctx.phone) phoneInput.value = ctx.phone;

          const demandes = readJson(STORAGE_KEYS.demandes);
          if (Array.isArray(demandes)) {
            demandes.forEach((item) => {
              if (!item?.training?._id) return;
              const option = document.createElement("option");
              option.value = item.training._id;
              option.textContent = `${item.training.title}`;
              trainingSelect.appendChild(option);
            });
          }

          uploadBtn.addEventListener("click", async () => {
            if (!fileInput.files || !fileInput.files[0]) {
              status.textContent = "Veuillez choisir un fichier.";
              status.style.color = "#c53030";
              return;
            }
            if (!emailInput.value.trim() || !phoneInput.value.trim()) {
              status.textContent = "Email et telephone obligatoires.";
              status.style.color = "#c53030";
              return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("email", emailInput.value.trim());
            formData.append("phone", phoneInput.value.trim());
            if (trainingSelect.value) formData.append("trainingId", trainingSelect.value);

            status.textContent = "Envoi du recu en cours...";
            status.style.color = "#1d6a34";
            try {
              const res = await fetch("/api/public/enrollments/receipt", { method: "POST", body: formData });
              if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.message || "Erreur lors de l'envoi.");
              }
              status.textContent = "Recu televerse. Notre equipe validera votre paiement.";
              status.style.color = "#1d6a34";
            } catch (error) {
              status.textContent = error.message || "Erreur lors de l'envoi.";
              status.style.color = "#c53030";
            }
          });

          return true;
        };

        const getAdminEnrollments = async () => {
          if (Array.isArray(window.__academyAdminEnrollments) && window.__academyAdminEnrollments.length > 0) {
            return window.__academyAdminEnrollments;
          }

          const token = sessionStorage.getItem("token");
          if (!token) return [];

          try {
            const res = await fetch("/api/admin/enrollments", {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (!res.ok) return [];
            const data = await res.json();
            if (Array.isArray(data)) {
              window.__academyAdminEnrollments = data;
              return data;
            }
          } catch (error) {
            return [];
          }

          return [];
        };

        const decorateAdminPayments = async () => {
          if (window.location.pathname !== "/admin") return false;
          const enrollments = await getAdminEnrollments();
          if (!Array.isArray(enrollments) || enrollments.length === 0) return false;

          const cards = Array.from(document.querySelectorAll(".dashboard-card")).filter((card) =>
            (card.textContent || "").includes("Reference paiement")
          );
          if (!cards.length) return false;

          const cardsParent = cards[0].parentElement;
          if (!cardsParent) return false;
          let pendingGrid = cardsParent;
          if (!pendingGrid.id) pendingGrid.id = "payments-pending-grid";

          let acceptedSection = document.getElementById("payments-accepted");
          if (!acceptedSection) {
            const heading = document.createElement("h3");
            heading.className = "mt-6 text-xl font-semibold text-[#091632] md:text-2xl";
            heading.textContent = "Paiements en attente";
            cardsParent.parentElement?.insertBefore(heading, cardsParent);

            acceptedSection = document.createElement("div");
            acceptedSection.id = "payments-accepted";
            acceptedSection.className = "mt-10";
            acceptedSection.innerHTML = `
              <h3 class="text-xl font-semibold text-[#091632] md:text-2xl">Paiements acceptes</h3>
              <div id="payments-accepted-grid" class="mt-4 grid gap-4 lg:grid-cols-2"></div>
            `;
            cardsParent.parentElement?.appendChild(acceptedSection);
          }

          const acceptedGrid = document.getElementById("payments-accepted-grid") || pendingGrid;

          const normalizeText = (value) =>
            (value || "")
              .replace(/\s+/g, " ")
              .trim()
              .toLowerCase();

          cards.forEach((card) => {
            if (card.dataset.receiptDecorated) return;
            const titleEl = card.querySelector("p.text-lg") || card.querySelector("p.font-semibold");
            const trainingTitle = titleEl ? titleEl.textContent.trim() : "";
            const normalizedCardText = normalizeText(card.textContent || "");
            const enrollment =
              enrollments.find((item) => {
                const fullName = normalizeText(item.fullName);
                const email = normalizeText(item.email);
                const training = normalizeText(item.training?.title);
                const titleMatches = trainingTitle
                  ? normalizeText(trainingTitle) === training || normalizedCardText.includes(training)
                  : normalizedCardText.includes(training);
                const emailMatches = email && normalizedCardText.includes(email);
                const nameMatches = fullName && normalizedCardText.includes(fullName);
                return titleMatches && (emailMatches || nameMatches);
              }) ||
              enrollments.find((item) => {
                const email = normalizeText(item.email);
                const training = normalizeText(item.training?.title);
                return !!email && !!training && normalizedCardText.includes(email) && normalizedCardText.includes(training);
              }) ||
              enrollments.find((item) => {
                const email = normalizeText(item.email);
                return !!email && normalizedCardText.includes(email);
              });
            if (!enrollment) return;

            const receiptBox = document.createElement("div");
            receiptBox.className = "mt-4 rounded-[18px] border border-[#e7dbc8] bg-[#fffaf1] px-4 py-3 text-sm text-slate-600";
            if (enrollment.paymentReceiptUrl) {
              receiptBox.innerHTML = `
                <p class="font-semibold text-[#091632]">Recu de virement</p>
                <a href="${enrollment.paymentReceiptUrl}" target="_blank" rel="noopener" class="mt-2 inline-flex items-center gap-2 text-gold font-semibold">Voir le recu</a>
              `;
            } else {
              receiptBox.innerHTML = `
                <p class="font-semibold text-[#091632]">Recu de virement</p>
                <p>Recu non recu pour cette inscription.</p>
              `;
            }

            const actions = document.createElement("div");
            actions.className = "mt-4 flex flex-col gap-2 sm:flex-row";
            actions.innerHTML = `
              <button class="btn-secondary w-full sm:w-auto" type="button">Accepter paiement</button>
              <button class="rounded-full border border-red-200 px-5 py-3 text-sm font-semibold text-red-600 w-full sm:w-auto" type="button">Refuser paiement</button>
            `;

            const [acceptBtn, refuseBtn] = actions.querySelectorAll("button");
            if (!enrollment.paymentReceiptUrl) {
              acceptBtn.textContent = "Recu manquant";
              acceptBtn.disabled = true;
            }

            const originalVerifyBtn = Array.from(card.querySelectorAll("button")).find((button) =>
              (button.textContent || "").trim().toLowerCase() === "verifier paiement"
            );
            const originalDeleteBtn = Array.from(card.querySelectorAll("button")).find((button) =>
              (button.textContent || "").trim().toLowerCase() === "supprimer"
            );

            const refreshReceiptBox = (currentEnrollment) => {
              if (currentEnrollment.paymentReceiptUrl) {
                receiptBox.innerHTML = `
                  <p class="font-semibold text-[#091632]">Recu de virement</p>
                  <a href="${currentEnrollment.paymentReceiptUrl}" target="_blank" rel="noopener" class="mt-2 inline-flex items-center gap-2 text-gold font-semibold">Voir le recu</a>
                `;
                acceptBtn.textContent = "Accepter paiement";
                acceptBtn.disabled = false;
              } else {
                receiptBox.innerHTML = `
                  <p class="font-semibold text-[#091632]">Recu de virement</p>
                  <p>Recu non recu pour cette inscription.</p>
                `;
                acceptBtn.textContent = "Recu manquant";
                acceptBtn.disabled = true;
              }
            };

            acceptBtn.addEventListener("click", async () => {
              try {
                const token = sessionStorage.getItem("token");
                const res = await fetch(`/api/admin/enrollments/${enrollment.id}/accept`, {
                  method: "POST",
                  headers: token ? { Authorization: `Bearer ${token}` } : {}
                });
                if (!res.ok) throw new Error("Erreur validation paiement.");
                const data = await res.json();
                enrollment.paymentStatus = data.paymentStatus || "Paye";
                enrollment.status = data.status || "Confirmee";
                enrollment.studentUserId = data.studentUserId || data.student_user_id || enrollment.studentUserId;
                const chips = card.querySelectorAll(".metric-chip");
                if (chips[0]) chips[0].textContent = "Confirmee";
                if (chips[1]) chips[1].textContent = "Paye";
                const lines = card.querySelectorAll("p.text-slate-600");
                lines.forEach((line) => {
                  if ((line.textContent || "").includes("Compte eleve")) {
                    line.textContent = `Compte eleve: Cree (#${data.studentUserId || data.student_user_id || ""})`;
                  }
                });
                acceptBtn.textContent = "Paiement accepte";
                acceptBtn.disabled = true;
                refuseBtn.disabled = true;
                if (originalVerifyBtn) {
                  originalVerifyBtn.textContent = "Paiement verifie";
                  originalVerifyBtn.disabled = true;
                }
                acceptedGrid.appendChild(card);
              } catch (error) {
                acceptBtn.textContent = "Erreur";
              }
            });
            refuseBtn.addEventListener("click", async () => {
              try {
                const token = sessionStorage.getItem("token");
                const res = await fetch(`/api/admin/enrollments/${enrollment.id}/reject`, {
                  method: "POST",
                  headers: token ? { Authorization: `Bearer ${token}` } : {}
                });
                if (!res.ok) throw new Error("Erreur refus paiement.");
                const chips = card.querySelectorAll(".metric-chip");
                if (chips[0]) chips[0].textContent = "Refusee";
                if (chips[1]) chips[1].textContent = "Refuse";
                refuseBtn.textContent = "Paiement refuse";
                refuseBtn.disabled = true;
                acceptBtn.disabled = true;
                if (originalVerifyBtn) {
                  originalVerifyBtn.disabled = true;
                }
              } catch (error) {
                refuseBtn.textContent = "Erreur";
              }
            });

            if (originalVerifyBtn && !originalVerifyBtn.dataset.receiptBound) {
              originalVerifyBtn.dataset.receiptBound = "true";
              originalVerifyBtn.addEventListener("click", async () => {
                try {
                  const token = sessionStorage.getItem("token");
                  const res = await fetch(`/api/admin/enrollments/${enrollment.id}/verify-payment`, {
                    headers: token ? { Authorization: `Bearer ${token}` } : {}
                  });
                  if (!res.ok) throw new Error("Verification impossible.");
                  const fresh = await res.json();
                  enrollment.paymentReceiptUrl = fresh.paymentReceiptUrl;
                  enrollment.paymentReceiptName = fresh.paymentReceiptName;
                  enrollment.paymentStatus = fresh.paymentStatus || enrollment.paymentStatus;
                  enrollment.status = fresh.status || enrollment.status;
                  refreshReceiptBox(enrollment);

                  if (enrollment.paymentReceiptUrl) {
                    originalVerifyBtn.textContent = "Verification ok";
                    acceptBtn.click();
                  } else {
                    originalVerifyBtn.textContent = "Recu manquant";
                  }
                } catch (error) {
                  originalVerifyBtn.textContent = "Erreur";
                }
              });
            }

            [originalVerifyBtn, originalDeleteBtn].forEach((button) => {
              if (!button) return;
              button.style.display = "none";
              button.setAttribute("aria-hidden", "true");
              button.disabled = true;
            });

            card.appendChild(receiptBox);
            card.appendChild(actions);
            card.dataset.receiptDecorated = "true";

            const isAccepted = enrollment.paymentStatus === "Paye" || enrollment.status === "Confirmee";
            if (isAccepted) {
              acceptedGrid.appendChild(card);
            } else {
              pendingGrid.appendChild(card);
            }
          });

          return true;
        };

        const styleDemandesStatus = () => {
          if (window.location.pathname !== "/demandes") return false;
          const cards = Array.from(document.querySelectorAll("section,article,div")).filter((el) =>
            (el.textContent || "").includes("Paiement:")
          );
          if (!cards.length) return false;

          const makePill = (label, variant) => {
            const span = document.createElement("span");
            span.textContent = label;
            span.style.display = "inline-flex";
            span.style.alignItems = "center";
            span.style.gap = "6px";
            span.style.padding = "6px 12px";
            span.style.borderRadius = "999px";
            span.style.fontSize = "12px";
            span.style.fontWeight = "700";
            span.style.letterSpacing = "0.04em";
            span.style.border = "1px solid transparent";
            if (variant === "confirmed") {
              span.style.background = "linear-gradient(135deg,#e6f9f0 0%,#d1fae5 45%,#f0fdf4 100%)";
              span.style.color = "#0f6b3a";
              span.style.borderColor = "#b7f0d1";
            } else if (variant === "paid") {
              span.style.background = "linear-gradient(135deg,#eef2ff 0%,#e0e7ff 45%,#f5f3ff 100%)";
              span.style.color = "#4338ca";
              span.style.borderColor = "#c7d2fe";
            } else if (variant === "receipt") {
              span.style.background = "linear-gradient(135deg,#fff7ed 0%,#ffedd5 45%,#fef3c7 100%)";
              span.style.color = "#9a3412";
              span.style.borderColor = "#fed7aa";
            } else if (variant === "pending") {
              span.style.background = "linear-gradient(135deg,#fef9ef 0%,#fdf2d7 45%,#fff7ed 100%)";
              span.style.color = "#a16207";
              span.style.borderColor = "#fde68a";
            } else {
              span.style.background = "#f8fafc";
              span.style.color = "#475569";
              span.style.borderColor = "#e2e8f0";
            }
            return span;
          };

          cards.forEach((card) => {
            if (card.dataset.statusStyled) return;
            const lines = Array.from(card.querySelectorAll("p,span,div"));
            lines.forEach((line) => {
              const text = (line.textContent || "").trim();
              if (text === "Confirmee") {
                line.textContent = "";
                line.appendChild(makePill("Confirmee", "confirmed"));
              }
              if (text === "En attente") {
                line.textContent = "";
                line.appendChild(makePill("En attente", "pending"));
              }
              if (text.startsWith("Paiement:")) {
                const value = text.replace("Paiement:", "").trim();
                line.textContent = "";
                if (value.toLowerCase().includes("paye")) {
                  line.appendChild(makePill("Paiement: Paye", "paid"));
                } else if (value.toLowerCase().includes("recu")) {
                  line.appendChild(makePill("Paiement: Recu", "receipt"));
                } else {
                  line.appendChild(makePill(`Paiement: ${value || "En attente"}`, "pending"));
                }
              }
            });
            card.dataset.statusStyled = "true";
          });

          return true;
        };

        const hookButtons = () => {
          document.querySelectorAll("button").forEach((btn) => {
            if (/s'inscrire/i.test(btn.textContent || "")) {
              btn.addEventListener("click", () => {
                setTimeout(insertAfterSuccess, 600);
              });
            }
          });
        };

        const hookValidateButton = () => {
          const buttons = Array.from(document.querySelectorAll("button"));
          buttons.forEach((btn) => {
            const label = (btn.textContent || "").toLowerCase();
            if (!label.includes("valider l'inscription")) return;
            if (btn.dataset.paymentModalBound) return;
            btn.dataset.paymentModalBound = "true";
            btn.addEventListener("click", () => {
              setTimeout(() => {
                showPaymentModal();
              }, 700);
            });
          });
        };

        const tryInsert = () => {
          wrapFetchOnce();
          hookButtons();
          hookValidateButton();
          injectDemandesUploader();
          decorateAdminPayments();
          styleDemandesStatus();
        };

        const observer = new MutationObserver(tryInsert);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        wrapFetchOnce();
        window.addEventListener("load", tryInsert);
        setInterval(tryInsert, 1200);
      })();
    </script>
      <script>
        (function () {
          const buildVideoSection = () => {
            if (document.getElementById("presentation-video")) return false;
            const headings = Array.from(document.querySelectorAll("h1,h2,h3,h4"));
            const presentationHeading = headings.find((h) => {
              const text = (h.textContent || "").trim().toLowerCase();
              return text.includes("presentation") && text.includes("centre");
            });
            const ateliersHeading = headings.find((h) => {
              const text = (h.textContent || "").trim().toLowerCase();
              return text.includes("nos ateliers") || text === "ateliers";
            });

            const presentationSection = presentationHeading ? presentationHeading.closest("section") : null;
            const ateliersSection = ateliersHeading ? ateliersHeading.closest("section") : null;
            const anchorSection = ateliersSection || presentationSection;
            if (!anchorSection) return false;

            const wrapper = document.createElement("div");
            wrapper.id = "presentation-video";
            wrapper.style.marginTop = "18px";
            wrapper.innerHTML = `
              <div style="display:flex;justify-content:center;">
                <div style="width:min(760px,100%);">
                  <div style="border-radius:28px;overflow:hidden;border:1px solid #ead9c0;box-shadow:0 20px 50px rgba(15,23,42,0.12);background:#fff;">
                    <video id="centre-video" muted autoplay loop playsinline controls style="width:100%;height:auto;display:block;background:#000;">
                      <source src="/videositeorigine.mp4" type="video/mp4" />
                      <source src="/videopres.mp4" type="video/mp4" />
                    </video>
                  </div>
                  <p style="margin-top:10px;font-size:12px;color:#8a7f72;text-align:center;">Cliquez sur le haut-parleur pour activer le son si besoin.</p>
                </div>
              </div>
            `;
            anchorSection.appendChild(wrapper);
            return true;
          };

          const tryInsert = () => {
            if (buildVideoSection()) {
              observer.disconnect();
              clearInterval(timer);
            }
          };

          const observer = new MutationObserver(tryInsert);
          observer.observe(document.documentElement, { childList: true, subtree: true });
          const timer = setInterval(tryInsert, 400);
          window.addEventListener("load", tryInsert);
        })();
      </script>
      <script>
        (function () {
          const mapping = {
            "Amira S.": { name: "Mme Élodie", img: "/mme-elodie-temoignage.jpeg" },
            "Lina M.": { name: "Mme Linda", img: "/mme-linda-temoignage.jpeg" },
            "Yasmine B.": { name: "Mme Marie", img: "/mme-marie-temoignage.jpeg" }
          };

        const findCard = (el) => {
          let current = el;
          for (let i = 0; i < 8 && current; i += 1) {
            if ((current.textContent || "").includes("Avis eleve")) return current;
            current = current.parentElement;
          }
          return null;
        };

        const injectAvatars = () => {
          const nameEls = Array.from(document.querySelectorAll("p,span,strong")).filter((el) =>
            Object.keys(mapping).includes((el.textContent || "").trim())
          );
          if (!nameEls.length) return false;

          let changed = false;
          nameEls.forEach((nameEl) => {
            if (nameEl.closest(".testimonial-avatar-row")) return;
            const card = findCard(nameEl);
            if (!card || card.dataset.avatarInjected === "true") return;
            const key = (nameEl.textContent || "").trim();
            const data = mapping[key];
            if (!data) return;

            const row = document.createElement("div");
            row.className = "testimonial-avatar-row";
            row.style.display = "flex";
            row.style.alignItems = "center";
            row.style.gap = "12px";

            const img = document.createElement("img");
            img.src = data.img;
            img.alt = data.name;
            img.style.width = "46px";
            img.style.height = "46px";
            img.style.borderRadius = "999px";
            img.style.objectFit = "cover";
            img.style.border = "2px solid #f3e7d3";
            img.style.boxShadow = "0 10px 20px rgba(15,23,42,0.12)";

            const nameSpan = document.createElement("span");
            nameSpan.textContent = data.name;
            nameSpan.style.fontWeight = "600";
            nameSpan.style.color = "#0f172a";

            row.appendChild(img);
            row.appendChild(nameSpan);
            nameEl.replaceWith(row);
            card.dataset.avatarInjected = "true";
            changed = true;
          });

          return changed;
        };

        const tryInject = () => {
          if (injectAvatars()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryInject);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryInject, 400);
        window.addEventListener("load", tryInject);
      })();
    </script>
    <script>
      (function () {
        const extraPartners = [
          { name: "MDC Capillaire Paris", src: "/mdc%20partenaire.jpeg" },
          { name: "Qualiopi", src: "/qualiopi%20partenaire.jpeg" }
        ];

        const enhancePartnersSection = () => {
          const headings = Array.from(document.querySelectorAll("h1,h2,h3,h4"));
          const partnersHeading = headings.find((heading) => (heading.textContent || "").trim() === "Nos Partenaires");
          if (!partnersHeading) return false;

          const section = partnersHeading.closest("section");
          if (!section) return false;

          const existingImages = Array.from(section.querySelectorAll("img")).filter((img) =>
            /partenaire|mdc|qualiopi/i.test(img.getAttribute("src") || "")
          );
          if (!existingImages.length) return false;

          const cards = existingImages
            .map((img) => img.closest("div"))
            .filter(Boolean);
          const grid =
            cards[0]?.parentElement ||
            existingImages[0]?.closest(".grid, .flex") ||
            existingImages
              .map((img) => img.parentElement)
              .find((parent) => parent && /(grid|flex)/i.test(parent.className || ""));
          if (!grid) return false;

          if (!grid.dataset.extraPartnersStyled) {
            grid.style.display = "grid";
            grid.style.gridTemplateColumns = "repeat(auto-fit, minmax(190px, 1fr))";
            grid.style.gap = "24px";
            grid.dataset.extraPartnersStyled = "true";
          }

          let changed = false;
          extraPartners.forEach((partner) => {
            const alreadyThere = Array.from(section.querySelectorAll("img")).some((img) => {
              const src = img.getAttribute("src") || "";
              const alt = img.getAttribute("alt") || "";
              return src.includes(partner.src.replace("/", "")) || alt.trim() === partner.name;
            });
            if (alreadyThere) return;

            const card = document.createElement("div");
            card.className =
              "rounded-[24px] border border-[#ead9c0] bg-white/95 p-4 shadow-[0_12px_32px_rgba(36,28,21,0.08)]";
            card.style.display = "flex";
            card.style.alignItems = "center";
            card.style.justifyContent = "center";
            card.style.minHeight = "168px";
            card.style.width = "100%";

            const image = document.createElement("img");
            image.src = partner.src;
            image.alt = partner.name;
            image.loading = "lazy";
            image.style.maxWidth = "100%";
            image.style.maxHeight = "108px";
            image.style.objectFit = "contain";

            card.appendChild(image);
            grid.appendChild(card);
            changed = true;
          });

          return changed;
        };

        const tryEnhance = () => {
          if (enhancePartnersSection()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryEnhance);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryEnhance, 500);
        window.addEventListener("load", tryEnhance);
      })();
    </script>
    <script>
      (function () {
        const isHomePage = () => window.location.pathname === "/" || window.location.pathname === "";

        const findVisibleEnrollmentArea = () => {
          const forms = Array.from(document.querySelectorAll("form")).filter((form) => {
            const rect = form.getBoundingClientRect();
            return rect.width > 0 && rect.height > 0;
          });
          if (forms.length) return forms[0];

          const containers = Array.from(document.querySelectorAll("section,article,div")).filter((el) => {
            const rect = el.getBoundingClientRect();
            const fields = el.querySelectorAll("input, textarea, select");
            return rect.width > 0 && rect.height > 0 && fields.length >= 3;
          });
          return containers[0] || null;
        };

        const findOpenEnrollmentTrigger = () =>
          Array.from(document.querySelectorAll("button,a")).find((el) => {
            const text = (el.textContent || "").trim().toLowerCase();
            return text.includes("s'inscrire") || text.includes("valider l'inscription");
          }) || null;

        const highlightTarget = (target) => {
          const previousShadow = target.style.boxShadow;
          const previousTransition = target.style.transition;
          target.style.transition = "box-shadow 0.25s ease, transform 0.25s ease";
          target.style.boxShadow = "0 0 0 4px rgba(202,165,106,0.16), 0 22px 44px rgba(202,165,106,0.2)";
          target.style.transform = "translateY(-2px)";
          window.setTimeout(() => {
            target.style.boxShadow = previousShadow;
            target.style.transition = previousTransition;
            target.style.transform = "";
          }, 1700);
        };

        const openEnrollmentForm = () => {
          const visibleArea = findVisibleEnrollmentArea();
          if (visibleArea) {
            visibleArea.scrollIntoView({ behavior: "smooth", block: "center" });
            highlightTarget(visibleArea);
            return;
          }

          const trigger = findOpenEnrollmentTrigger();
          if (trigger) {
            trigger.scrollIntoView({ behavior: "smooth", block: "center" });
            window.setTimeout(() => trigger.click(), 400);
          }
        };

        const createButton = () => {
          const button = document.createElement("button");
          button.id = "floating-enrollment-button";
          button.type = "button";
          button.setAttribute("aria-label", "Aller au formulaire d'inscription");
          button.innerHTML = `
            <span style="display:inline-flex;height:38px;width:38px;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.24);backdrop-filter:blur(12px);flex-shrink:0;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 3.75H15.25L20.25 8.75V18.75C20.25 19.9926 19.2426 21 18 21H8C6.75736 21 5.75 19.9926 5.75 18.75V6C5.75 4.75736 6.75736 3.75 8 3.75Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M15 3.75V8.25C15 8.66421 15.3358 9 15.75 9H20.25" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8.75 13H15.25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M8.75 16.5H13.25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.08;">
              <strong style="font-size:13px;font-weight:700;">Formulaire</strong>
              <span style="font-size:11px;opacity:0.92;">Contact</span>
            </span>
          `;
          button.style.position = "fixed";
          button.style.left = window.innerWidth <= 640 ? "12px" : "18px";
          button.style.bottom = window.innerWidth <= 640 ? "78px" : "20px";
          button.style.zIndex = "9998";
          button.style.display = "inline-flex";
          button.style.alignItems = "center";
          button.style.gap = "10px";
          button.style.padding = window.innerWidth <= 640 ? "9px 13px 9px 9px" : "10px 15px 10px 10px";
          button.style.borderRadius = "999px";
          button.style.border = "1px solid rgba(214,187,142,0.95)";
          button.style.background = "linear-gradient(135deg,#b88d4b 0%,#d8b274 55%,#f3d9a9 100%)";
          button.style.color = "#fffdfa";
          button.style.boxShadow = "0 22px 42px rgba(139,98,34,0.28)";
          button.style.cursor = "pointer";
          button.style.fontFamily = "inherit";
          button.style.transition = "transform 0.25s ease, box-shadow 0.25s ease";
          button.addEventListener("mouseenter", () => {
            button.style.transform = "translateY(-2px)";
            button.style.boxShadow = "0 26px 50px rgba(139,98,34,0.34)";
          });
          button.addEventListener("mouseleave", () => {
            button.style.transform = "";
            button.style.boxShadow = "0 22px 42px rgba(139,98,34,0.28)";
          });
          button.addEventListener("click", openEnrollmentForm);
          return button;
        };

        const mountButton = () => {
          if (!isHomePage()) return false;
          if (document.getElementById("floating-enrollment-button")) return true;
          document.body.appendChild(createButton());
          return true;
        };

        const tryMount = () => {
          if (mountButton()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryMount);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryMount, 500);
        window.addEventListener("load", tryMount);
      })();
    </script>
