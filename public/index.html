    <script>
      (function () {
        const move = () => {
          const headings = Array.from(document.querySelectorAll("h2"));
          const partnersHeading = headings.find(
            (h) => h.textContent.trim() === "Nos Partenaires"
          );
          const contactHeading = headings.find(
            (h) => h.textContent.trim() === "Nous Trouver"
          );
          if (!partnersHeading || !contactHeading) return false;
          const partnersSection = partnersHeading.closest("section");
          const contactSection = contactHeading.closest("section");
          if (!partnersSection || !contactSection) return false;
          if (partnersSection === contactSection) return false;
          if (partnersSection.nextElementSibling === contactSection) return true;
          contactSection.parentNode.insertBefore(partnersSection, contactSection);
          return true;
        };

        const tryMove = () => {
          if (move()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryMove);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryMove, 400);
        window.addEventListener("load", tryMove);
      })();
    </script>
    <script>
      (function () {
        const upgrade = () => {
          let changed = false;
          const chips = Array.from(document.querySelectorAll("div,span,p,li"));
          chips.forEach((el) => {
            if (el.textContent && el.textContent.trim() === "Amincissement et remoulage") {
              el.textContent = "Amincissement et remodelage";
              changed = true;
            }
          });

          const cvLink = document.querySelector('a[href="/formatrice-gharbi.pdf"]');
          if (cvLink) {
            cvLink.setAttribute("target", "_blank");
            cvLink.setAttribute("rel", "noopener");
            cvLink.className =
              "mt-5 inline-flex w-full items-center justify-center gap-3 rounded-full border border-[#d7c3a1] bg-[linear-gradient(120deg,#fffaf1,#f7ead6)] px-5 py-3 text-sm font-semibold text-[#1f2a44] shadow-[0_16px_32px_rgba(18,26,46,0.12)] transition hover:-translate-y-0.5 hover:border-[#caa56a] hover:bg-[linear-gradient(120deg,#fff7e8,#f1e1c6)]";
            if (!cvLink.querySelector(".cv-pill")) {
              cvLink.innerHTML = '<span class="cv-pill flex h-8 w-8 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gold shadow-[0_8px_16px_rgba(15,23,42,0.12)]">PDF</span>Voir le CV';
            }
            changed = true;
          }

          return changed;
        };

        const tryUpgrade = () => {
          if (upgrade()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryUpgrade);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryUpgrade, 400);
        window.addEventListener("load", tryUpgrade);
      })();
    </script>
    <script>
      (function () {
        const buildCard = (name, img, pdf, role, altImg) => `
          <article class="rounded-[28px] border border-white/70 bg-white/90 p-4 shadow-[0_16px_40px_rgba(15,23,42,0.12)] md:p-5">
            <div class="overflow-hidden rounded-[22px] border border-[#efe5d8] bg-white">
              <img src="${img}" alt="${name}" data-alt="${altImg || ""}" class="h-[260px] w-full object-contain p-3 md:h-[320px]" onerror="if(this.dataset.alt){this.onerror=null;this.src=this.dataset.alt;this.dataset.alt='';return;}this.onerror=null;this.src='/logo.jpeg';" />
            </div>
            <h3 class="mt-4 text-2xl font-semibold text-[#0a0f1a]">${name}</h3>
            <p class="mt-1 text-sm font-semibold uppercase tracking-[0.22em] text-gold">${role}</p>
            <a href="${pdf}" target="_blank" rel="noopener" class="mt-4 inline-flex w-full items-center justify-center gap-3 rounded-full border border-[#d7c3a1] bg-[linear-gradient(120deg,#fffaf1,#f7ead6)] px-5 py-3 text-sm font-semibold text-[#1f2a44] shadow-[0_16px_32px_rgba(18,26,46,0.12)] transition hover:-translate-y-0.5 hover:border-[#caa56a] hover:bg-[linear-gradient(120deg,#fff7e8,#f1e1c6)]">
              <span class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-[11px] font-bold text-gold shadow-[0_8px_16px_rgba(15,23,42,0.12)]">PDF</span>
              Voir le CV
            </a>
          </article>
        `;

        const replaceSection = () => {
          const sections = Array.from(document.querySelectorAll("section"));
          const candidate = sections.find(
            (s) =>
              s.textContent.includes("Notre formatrice") ||
              (s.querySelector("h2") &&
                s.querySelector("h2").textContent.trim() === "Madame Gharbi")
          );

          const newMarkup = `
            <div class="mx-auto max-w-7xl px-5 py-8 md:px-8 md:py-12">
              <div class="flex items-center gap-3">
                <p class="text-sm font-bold uppercase tracking-[0.24em] text-gold">Nos formatrices</p>
              </div>
              <h2 class="section-title mt-3 text-4xl font-bold leading-tight text-[#0a0f1a] md:text-5xl">Une equipe pedagogique experimentee</h2>
              <p class="mt-4 max-w-2xl text-base leading-8 text-slate-900">
                Des formatrices exigeantes, bienveillantes et orientees resultats pour un apprentissage premium.
              </p>
              <div class="mt-8 grid gap-6 md:grid-cols-2">
                ${buildCard("Madame Gharbi", "/formatrice-gharbi.jpeg", "/formatrice-gharbi.pdf", "Esthetique avancee", "/formatrice-gharbi.jpg")}
                ${buildCard("Madame Oumayma", "/formatrice-oumayma.jpg", "/cv-oumayma.pdf", "Kinesitherapeute", "/formatriceoumayma.jpeg")}
              </div>
            </div>
          `;

          if (candidate) {
            candidate.innerHTML = newMarkup;
            const duplicates = Array.from(document.querySelectorAll("section"))
              .filter((s) =>
                s !== candidate &&
                (s.textContent.includes("Nos formatrices") ||
                  s.textContent.includes("Une equipe pedagogique experimentee"))
              );
            duplicates.forEach((s) => s.remove());
            return true;
          }

          const offersHeading = Array.from(document.querySelectorAll("h2")).find(
            (h) => h.textContent.trim() === "Nos Offres"
          );
          if (!offersHeading) return false;
          const offersSection = offersHeading.closest("section");
          if (!offersSection) return false;
          if (document.getElementById("nos-formatrices")) return true;

          const section = document.createElement("section");
          section.id = "nos-formatrices";
          section.className =
            "mt-12 overflow-hidden rounded-[30px] border border-[#ead9c0] bg-[linear-gradient(135deg,#fffdfa_0%,#f7ecde_52%,#fff9f4_100%)] shadow-[0_20px_60px_rgba(36,28,21,0.08)] md:mt-16 md:rounded-[36px]";
          section.innerHTML = newMarkup;
          offersSection.parentNode.insertBefore(section, offersSection);
          const duplicates = Array.from(document.querySelectorAll("section"))
            .filter((s) =>
              s !== section &&
              (s.textContent.includes("Nos formatrices") ||
                s.textContent.includes("Une equipe pedagogique experimentee"))
            );
          duplicates.forEach((s) => s.remove());
          return true;
        };

        const tryReplace = () => {
          if (replaceSection()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryReplace);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryReplace, 400);
        window.addEventListener("load", tryReplace);
      })();
    </script>
