<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beauty Academy Tunis - Centre de Formation</title>
    <meta name="description" content="Centre premium de formation esthetique a Tunis Belvedere: microneedling, capillaire, hydrafacial, soins visage et plus." />
    <meta name="keywords" content="#microneedling,#capillaire,#esthetiqueavancee,#formationprofessionnelle,#formationenligne,#formationpresentiel,#hydrafacial,#tunis" />
    <script type="module" crossorigin src="/assets/index-B9G38RkP.js?v=20260316-25"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-qGXqTXna.css?v=20260316-25">
    <link rel="stylesheet" href="/hero-overrides.css?v=20260316-25">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const move = () => {
          const headings = Array.from(document.querySelectorAll("h2"));
          const partnersHeading = headings.find(
            (h) => h.textContent.trim() === "Nos Partenaires"
          );
          const contactHeading = headings.find(
            (h) => h.textContent.trim() === "Nous Trouver"
          );
          if (!partnersHeading || !contactHeading) return false;
          const partnersSection = partnersHeading.closest("section");
          const contactSection = contactHeading.closest("section");
          if (!partnersSection || !contactSection) return false;
          if (partnersSection === contactSection) return false;
          if (partnersSection.nextElementSibling === contactSection) return true;
          contactSection.parentNode.insertBefore(partnersSection, contactSection);
          return true;
        };

        const tryMove = () => {
          if (move()) {
            observer.disconnect();
            clearInterval(timer);
          }
        };

        const observer = new MutationObserver(tryMove);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(tryMove, 400);
        window.addEventListener("load", tryMove);
      })();
    </script>
    <script>
      (function () {
        const labelToCode = {
          Tunisie: "TN",
          France: "FR",
          Italie: "IT",
          Suisse: "CH",
          Canada: "CA",
          "Afrique subsaharienne": "AF",
          Libye: "LY",
          Algerie: "DZ",
          Maroc: "MA"
        };

        const isCountryModal = (node) => {
          if (!node) return false;
          const heading = node.querySelector ? node.querySelector("h2") : null;
          return heading && heading.textContent.trim() === "Choisissez votre pays";
        };

        document.addEventListener(
          "click",
          (event) => {
            const btn = event.target.closest("button");
            if (!btn) return;
            const modal = btn.closest("div");
            if (!modal || !isCountryModal(modal)) return;
            const label = (btn.querySelector("span") || btn).textContent.trim();
            const code = labelToCode[label];
            if (!code) return;
            try {
              sessionStorage.setItem("academy_country", code);
            } catch (e) {}
            window.location.reload();
          },
          true
        );
      })();
    </script>
  </body>
</html>
