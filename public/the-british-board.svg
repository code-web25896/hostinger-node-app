<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7228" />
      <stop offset="25%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#FFF3D4" />
      <stop offset="75%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#805B1B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#060C18" />
    </linearGradient>
  </defs>

  <!-- Background card rounded -->
  <rect x="4" y="4" width="392" height="152" rx="20" fill="#0A1224" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Shield Crest Icon (Left) -->
  <g transform="translate(24, 25)">
    <!-- Shield Outline -->
    <path d="M55 5 L95 20 V65 C95 95 55 105 55 105 C55 105 15 95 15 65 V20 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Crown at top of shield -->
    <path d="M38 35 L44 48 L55 37 L66 48 L72 35 L76 56 H34 Z" fill="url(#goldGrad)" />
    <!-- Stars -->
    <circle cx="55" cy="72" r="3" fill="#FFF3D4" />
    <circle cx="44" cy="74" r="2.2" fill="#C5A059" />
    <circle cx="66" cy="74" r="2.2" fill="#C5A059" />
    <!-- Ribbon banner under crown -->
    <path d="M30 84 Q55 92 80 84" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(138, 28)">
    <!-- Small Tagline -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#C5A059" text-transform="uppercase">
      ACCREDITATION INTERNATIONALE
    </text>

    <!-- Main Title -->
    <text x="0" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" letter-spacing="1" fill="#FFFFFF">
      THE BRITISH BOARD
    </text>

    <!-- Subtitle / Status -->
    <text x="0" y="76" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5" fill="#E2D0B0">
      Official Accredited Institution
    </text>

    <!-- Official URL Link badge -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="rgba(197,160,89,0.15)" stroke="url(#goldGrad)" stroke-width="1" />
      <text x="12" y="16" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFD700" letter-spacing="0.8">
        britishboard-official.com
      </text>
      <!-- Small check icon -->
      <circle cx="204" cy="12" r="6" fill="#C5A059" />
      <path d="M201 12 L203 14 L207 10" stroke="#0A1224" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
